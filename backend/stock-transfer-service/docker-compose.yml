services:
  mysql:
    image: mysql:8.3
    container_name: stock-transfer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock_transfer_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  stock-transfer:
    build: .
    container_name: stock-transfer-service
    depends_on:
      - mysql
    ports:
      - "8051:8051"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stock_transfer_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  mysql_data: