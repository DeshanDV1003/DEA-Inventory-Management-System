spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://mysql-db:3306/ProductDB
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8070