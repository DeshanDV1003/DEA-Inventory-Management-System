spring:
  application:
    name: supplier-service
  datasource:
    url: jdbc:mysql://localhost:3308/supplier_db?createDatabaseIfNotExist=true
    username: root
    password: root123   # <-- set your real DB password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # dialect is automatically selected by Spring Boot; remove if present
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8086

services:
  product:
    url: http://localhost:8081
  purchase-order:
    url: http://localhost:8088
  grn:
    url: http://localhost:8089
