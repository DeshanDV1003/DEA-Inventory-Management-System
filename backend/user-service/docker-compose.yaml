services:
  # MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: mysql-user-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: UserDB
    ports:
      - "3307:3306"  # External:Internal (avoid conflict with local MySQL)
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service
  user-service:
    build: .
    container_name: user-service
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8071:8071"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/UserDB?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  mysql-data: